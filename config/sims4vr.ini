; Sims4VR settings. Lives next to sims4vr.dll in Mods/sims4vr/.
; Changes take effect the next time the game starts.
; Or press B in the headset: the debug menu changes most of these while you play and
; keeps them in sims4vr_user.ini, which wins over this file (delete it to use this file again).

[general]
; 1 = start VR when the main menu appears (the first loading screen stays on the desktop view)
; 2 = start VR as soon as the script mod loads (the loading screen shows in the headset)
; 0 = only with the cheat console: vr.start
autostart = 1
; quad   = the game on a virtual screen in front of you
; stereo = 3D view from the game camera that follows your head
; body   = stereo, seen through the active Sim's eyes
; Switch in game with the cheat console: vr.mode quad / vr.mode stereo / vr.mode body
mode = quad
; 1 = switch to stereo when a lot finishes loading, back to quad in menus and loading screens
auto_stereo = 1
; what you get when a lot finishes loading (with auto_stereo = 1): body (first person) or stereo
play_mode = body

[quad]
; metres
distance = 2.0
width = 2.4

[stereo]
; game units per metre of real head movement (1 game unit is about 1 metre)
world_scale = 1.0
; 1 = give the game camera the headset's field of view (recommended)
fov_override = 1
; 1 = each eye drawn with its own lopsided field of view (wider on the outer side), as the
; headset shows it; 0 = a centred view wide enough for the wider side (about a third more
; picture, which the headset never shows). Debug menu: View > Picture
exact_fov = 1
; 0..1, sharpening of the image in the headset (0 = off; 0.6 is a good start)
sharpen = 0.6
; 1 = turning with the right stick (or the game camera turning) is smoothed like a head
; turn: both eyes show the same heading and the turn moves every headset refresh
turn_reprojection = 1
; 1 = the stick turn advances by the headset's display clock, so every frame you see is turned
; by the same step (0 = by the PC clock when the frame was handed over, which jitters a little)
turn_display_clock = 1
; 1 = in free movement the stick walk moves you by the headset's refreshes too, so every pair of
; eye pictures you see is moved on by the same step (0 = by the PC clock, which jitters with the
; game's frames: uneven steps, most visible walking sideways)
walk_display_clock = 1
; with turn_reprojection, in free movement: 1 = each pair of eye pictures is drawn at the heading
; the stick turn will have reached when the headset shows it, so the turn correction stays small
; and near things (your Sim, other Sims) don't wobble while you turn
turn_lead = 1
; 1 = while the headset is on, the game gets below-normal priority on the graphics card, so
; Virtual Desktop's streamer always gets the card in time to send the next frame (a game that
; fills the card starves it and the headset link jams)
gpu_yield = 1
; first person: 1 = the game draws one eye per frame, so walking moved you a few centimetres
; between the left and the right eye's pictures (double vision). Each right eye is drawn from
; where its left eye was, and the headset only gets whole pairs.
paired_eyes = 1
; diagnostic: 1 = log the order of the game's render work and its call stacks for a few frames
; (log "Frame map"), for the both-eyes-per-frame work; 0 = off
frame_map = 1
; with paired_eyes, while you move freely: 1 = your body and arms are posed from where the next
; pair is drawn from, so your hands sit in the same place in both eyes (they jiggled before).
paired_hands = 1
; first person, with turn_reprojection: 1 = your own body goes to the headset on a layer of its
; own, so stick turning doesn't turn it with the world (hands doubled while turning); where it
; was, the world is filled in from around it
body_layer = 1
; SteamVR only: 1 = every frame, the eye the game rendered a frame ago is turned to where your
; head is now, so SteamVR shows both eyes steady (without it one eye judders). Virtual Desktop
; doesn't need it.
align_eyes = 1
; game render resolution as a fraction of what the headset asks for (0 = monitor resolution).
; Lower it if the game gets slow; 1.0 is full headset sharpness but heavy.
render_scale = 0.8
; edge smoothing (MSAA) at that resolution: at most this many samples, never more than your
; in-game setting (0 = off, 2, 4, 8). 4 at 0.8 costs about what 8 at monitor size does; 2 is
; the default since v0.13.63 to give the graphics card room (the headset's resolution
; already smooths most edges). The DX9 game can't smooth edges at a raised resolution: there it stays off.
render_msaa = 2
; sun shadow map size (pixels per cascade) while the headset view is on, god view too:
; 4096 is four times the detail of the game's best (2048). 0 = the game's own.
shadow_map = 4096
; first person: 1 = keep the game's habit of making things see-through or fading them
; when the camera gets close (trees, columns, a fridge your head is in). 0 = never.
; God view always fades like the game.
near_fade = 0

[body]
; vr.mode body: your view sits at the active Sim's eyes and follows them
; metres your view sits behind the Sim's eyes, inside its head: your own face and
; hair never get in the way (mirrors still show them). Raise it if you see bits of
; your face or hair, lower it toward 0 for the exact eye position
eye_inset = 0.02
; only for a Sim without eye joints: metres from its head joint to your eyes
; (along where you look) / above it
forward = 0.10
height = 0.15
; 0..1, how quickly the view follows the head; lower = steadier while walking
smoothing = 0.3
; 1 = while seated (and in other game animations) the Sim leans with your real
; head, your view starts at its eyes when it sits down and never leaves its head
seat_follow = 1
; 1 = while seated your head moves the Sim's upper body: the animation keeps its
; posture but its sway (typing at a computer and so on) is left out
seat_torso = 1
; first person: while one of these animations plays, "straight ahead" lies the way your Sim's
; upper body does (on its back, looking straight ahead looks up); your head still looks
; around freely. Comma separated parts of interaction names (logged as "the game has the Sim")
body_view_anims = WickedWhims_Sex_Animation
; 0..1, how quickly your view turns when the Sim turns; 0 = never turn with the Sim
turn_smoothing = 0.1
; metres; how close things can be before they get cut off (0 = the game's own, about 1.5)
near_clip = 0.08
; 1 = that limit follows what is actually close, up to near_max, so far walls and buildings
; don't flicker (DX11); 0 = always near_clip
near_adaptive = 1
near_max = 0.75
; first person: 1 = your own face, eyes, teeth and eyelashes are folded out of the view from
; your eyes (mirrors, water and shadows still show them; hair and hats stay); 0 = they show
hide_face = 1
; first person: 1 = a room you look into through a doorway is drawn whole, and stays drawn
; while you stand where you saw it (in a door frame the game hides its things); 0 = the game's own
rooms_whole = 1
; 1 = sun shadows hold still in first person (no shimmer when the clock runs or you move
; your head); 0 = the game's own. shadow_step: degrees the sun moves before they follow
steady_shadows = 1
shadow_step = 0.2
; metres the sharpest shadows reach in first person (the game's first cascade is 10 m);
; nearer means sharper close shadows. 0 = the game's split
shadow_sharp = 5
; 1 = at a ladder, spiral stairs or stairs that are an object, push the stick toward it
; and the game carries your Sim through with its own animation (straight stairs you walk)
carried_stairs = 1
; 1 = in first person the game draws your body at your own height, so on stairs it is on
; the steps you are on; 0 = the game puts it on the floor of the level your Sim is on
keep_height = 1
; 1 = walking into walls and furniture slides along them smoothly; 0 = the old way (snaps to the
; nearest clear direction in 15 degree steps)
smooth_slide = 1
; seconds walking takes to come to rest after you let go of the stick, easing in and out
; (0 = the old quick stop)
stop_time = 0.5
; 1 = the game's own start-walking and stop-walking animations in first person (you slow down
; over the stop animation's length); 0 = straight from walking to standing
walk_clips = 1
; 1 = in first person your Sim never walks itself to things: a pie menu pick on something
; more than 1 m away does nothing, and a Sim you pick from farther away walks over to you
reach_only = 1
; 1 = guiding trail (first person): picking something farther than 1 m doesn't walk your Sim
; and isn't refused: the action waits in the queue for you to walk there yourself (scriptmod
; trail.py, logged as "trail: waiting"); 0 = far picks do nothing (reach_only above)
trail = 1
; Pie menus show what is out of reach greyed out, saying why ("Too far away"; a computer: "Sit at the computer to use it").
grey_far = 1
; 1 = in first person your Sim's reactions (smelling something bad, disgust at a mess, a need
; in the red: hungry, dirty, bursting) play their sound and animation right where you are
; and never stop your walking or turn you; 0 = the game stops you for them
reactions_in_place = 1
; 1 = in first person the game can't send your Sim to anything by script (running to a fire
; to panic, repairing something you didn't pick); what happens to your Sim itself (wetting
; itself, passing out, catching fire) still does; 0 = the game's script pushes go through
no_errands = 1
; 1 = in first person a walk the game gives your Sim that you didn't ask for (not picked by you,
; not the next step of something you picked) and that goes further than 1 m is stopped at once
; (scriptmod halt.py, logged as "halt: route guard"); 0 = the game may walk your Sim
route_guard = 1
; 1 = in first person you stay in your Sim: portraits, the next-Sim key and holding the right
; stick down don't switch Sims (switch in the game camera); 0 = switching works as usual
keep_sim = 1
; first person: the Sims you are talking with follow you once the nearest of them is farther
; than this many metres (scriptmod hint.py); leave a conversation by cancelling it on your
; wrist's queue; 0 = they don't follow (the conversation stays where it started)
follow_distance = 2.5
; first person: "Follow me" / "Dismiss" in other Sims' pie menus (scriptmod follow.py); a Sim
; you told to follow walks after you everywhere and does nothing on its own until dismissed
follow_me = 1
; first person: a social you pick with a Sim within this many metres starts where you both are;
; further away you walk up to them (footprints) until you are this close (mixers too)
talk_distance = 3
; 1 = in first person another Sim's chat or flirt with you happens right where you are: your
; Sim doesn't walk over to it or sit down beside it, and you can walk on (they follow you)
socials_in_place = 1
; right stick turning speed in degrees per second at full push
turn_rate = 150
; left stick walking speed in metres per second at full push
walk_speed = 1.5
; the same while running (tap the left stick to run or walk)
run_speed = 3.0
; 1 = the Sim's arms reach for your controllers and its fingers follow the buttons
arm_ik = 1
; degrees the Sim's hands point down from the controller's grip; raise it if
; the hands still tilt up toward you, lower it if they droop
hand_pitch = 40
; 1 = with the controllers put down, your Sim's hands and fingers follow your
; real hands in first person (the headset's hand tracking). Looks only: a
; tracked hand presses, points, touches and picks up nothing
hand_tracking = 1
; 1 = the Sim's head looks where you look (and never at other Sims)
head_tracking = 1
; 1 = point with your index finger (grip pressed, trigger not touched) and touch
; an object or a Sim to click it: its menu opens at your hand
touch = 1
; metres past the Sim's fingertip where a touch counts; raise it if touches come
; late, lower it if they come before your finger reaches things
touch_past = 0.015

[hands]
; first person: close a hand (grip) near a plate, cup, book or other small object to pick it
; up, open it to put it down (on the counter or table under it, else on the floor)
grab = 1
; food or a drink in your hand brought to your mouth takes a bite (an empty hand that
; touched the food works too, like a fork)
eat = 1
; after cooking or serving, your Sim no longer picks the food up and eats it by itself:
; you carry it and eat it yourself
no_auto_eat = 1

[physical]
; first person, other Sims (like Skyrim VR's PLANCK): your hands stop at their bodies instead
; of passing through, and the part you push gives a little; you can't walk through them
bodies = 1
; close a hand around a Sim's hand to hold it (palm to palm), open it to let go
hold_hands = 1
; lean in close in front of a Sim and it looks at you
look_at_you = 1
; your head can't go into other Sims: leaning into one pushes you back out sideways
; (only you move; needs bodies = 1), keeping your view head_radius metres clear of them
head = 1
head_radius = 0.08
; squeeze grip and trigger together on any part of a Sim's body to hold it; the part follows
; your hand a little (breasts are Claude Jiggle's)
grab_bodies = 1
; how far the fingers close on a held body (0 open .. 1 a fist)
grab_curl = 0.45
; metres the held place can be dragged along with your hand (Claude Jiggle's breasts and butt
; keep their own settings)
grab_drag = 0.15
; the Sim you grab reacts the game's way: the matching social (hug, caress cheek, kiss) decides
; if they welcome it, with its relationship changes, and they giggle, flinch or look shocked
grab_reactions = 1
; the controller vibrates while that hand touches a Sim
haptics = 1

[controls]
; 1 = EXPERIMENTAL: the left stick moves the camera through the game's own Xbox
; controller support. Crashed the game when loading a household (v0.5.2). 0 = WASD keys
gamepad = 0
; right stick turning speed at full push (gentle near the centre, fast at the edge)
turn_speed = 900

[ui]
; 1 = in stereo, show the game's menus on a floating panel instead of inside the 3D view
panel = 1
; metres from where you recentered; height is the panel centre relative to eye level
distance = 1.0
width = 1.3
height = -0.15
; first person: 1 = the menus show on your left wrist when you turn its inside toward your face
; (point with the right hand's laser or touch them with your right index finger), 2 = on the
; panel in front as above, 3 = both (wrist and in front), 0 = hidden (the pie menu at your hand still shows).
; Since v0.13.151: 1 = only our HUD ([wrist]), 2 = only the game's UI in front, 3 = both (and the
; watch's UI button puts the game's full UI on your wrist)
first_person = 1
wrist_width = 0.40
; first person: a pie menu opened by clicking the world shows where you clicked, within reach
; (point and pull the trigger, or poke an option with your finger). 0 = on the panel
pie_at_hand = 1
; first person: your own pie menu (what clicking your Sim opens), in front of you. Poke your
; stomach with the grip held (trigger too or not), or point the laser (grip + A / X) at your other
; hand's palm and pull the trigger
self_pie_poke = 1
self_pie_palm = 1
; metres from your eyes at most, and its width in metres
pie_distance = 0.45
pie_width = 0.96
; how much of the UI around the click is shown, as a fraction of the UI's height (raise it if
; options are cut off, e.g. with a large UI scale)
pie_crop = 0.75
; first person: a game picker (Cook... recipes, a TV's channels or movies) shows on the object it
; is for: on a fridge's or stove's front at your eye height, inside a TV's screen. It sits in the
; world (your hands pass in front of it). Point or poke as with the pie menu. 0 = off (the picker
; stays on the wrist / phone)
object_menus = 1
; metres wide at least on a door or front (a screen always fits inside the TV)
object_menu_width = 0.45
; speech and thought bubbles, skill bars and stat flyaways over Sims are drawn as cards over
; the Sim in the world (walls hide them), first person and god view. 0 = they stay on the
; flat UI (panel / wrist)
bubbles_3d = 1
; first person: a game popup waiting for an answer ("become a Fun-seeking Sim?") shows as a card
; in the world: beside the Sim it is about when that Sim is within 5 m on your floor and in your
; room (walls hide it, like a speech bubble), else in front of you (over the world, your hands in
; front of it). Only the dialog, not the game's blue dimming. Point or poke it. The game still
; pauses for it. 0 = it stays on the wrist / phone
popups_3d = 1
; metres in front of you
popup_distance = 0.75
; card width per metre away (0.55: 41 cm at 75 cm; beside a Sim 3 m away, 1.65 m, capped at 1.4)
popup_size = 0.55
; first person: 1 = a decision popup about other Sims only (not the one you play) never shows:
; the game answers it at once with one of its answers picked at random; 0 = it shows
others_decide = 1

[wrist]
; Our own HUD in first person, laid out with Dear ImGui in the game's own UI art
; and icons, from the game's values (debug menu "Wrist and HUD"). Poke with your
; right index finger or point the laser.
hud = 1
; The game's blue dimming behind dialogs switched off everywhere, at the game's
; own drawing (1 on). Changing it counts from the next game start.
no_dimming = 1
; Every element's size times this.
scale = 1
; Each element: <name>_pos = x y z (metres), <name>_turn = yaw pitch roll
; (degrees: spin it flat, tip it about its width, tip it about its height),
; <name>_size (metres wide). On an arm the place is built on your Sim's own
; forearm bones (elbow and wrist joints, palm side from its hand joint): x toward
; the elbow from the wrist, y sideways round the arm, z out from the bone line,
; plus <name>_around = degrees round the arm from the palm side. Around you: x
; right, y up, z ahead of your eyes (pause: from where popups show).
; The watch (clock, day, speed buttons, game UI button) inside your left wrist.
watch = 1
watch_pos = 0.06 0 0.035
watch_turn = 0 0 0
watch_around = 0
watch_size = 0.09
; A pause symbol 30 cm under where popups show, while the game is paused.
pause = 1
pause_pos = 0 -0.3 0
pause_turn = 0 0 0
pause_size = 0.06
; The watch low in your view while your Sim sleeps.
sleep_clock = 1
sleep_pos = 0 -0.22 0.6
sleep_turn = 0 0 0
sleep_size = 0.16
; The round build/buy button on your left wrist's thumb side (presses F2).
build_button = 1
build_button_pos = 0.03 0 0.028
build_button_turn = 0 0 0
build_button_around = 90
build_button_size = 0.04
; The action queue's bubbles along the top of your left forearm, running first
; at the wrist; press one to cancel it. actions_size = its length in metres.
actions = 1
actions_pos = 0.12 0 0.035
actions_turn = 0 0 0
actions_around = 180
actions_size = 0.17
; The need bars inside your right forearm, and the moodlets toward the elbow.
needs = 1
needs_pos = 0.08 0 0.035
needs_turn = 0 0 0
needs_around = 0
needs_size = 0.12
moodlets = 1
moodlets_pos = 0.17 0 0.045
moodlets_turn = 0 0 0
moodlets_around = 0
moodlets_size = 0.1
; The wants above you (seen when you look up).
wants = 1
wants_pos = 0 0.45 0.3
wants_turn = 0 0 0
wants_size = 0.36

[audio]
; 1 = sound comes from where things are relative to your head: it turns with you,
; and in body mode it is heard from your Sim's head. 0 = the game's own listener
follow_head = 1
; first person: 1 = every sound 1 m or more away comes from where it is; 0 = the game's own
; spread, which plays some far sounds (voices, crying) in the middle of your head
pan_any_distance = 1
; first person: outdoor sounds (birds, wind, street) are full anywhere outside and fade out
; over this many metres inside the house; 0 = the game's switch at the doorway
outdoor_fade = 4
; first person, inside: 1 = the outdoors comes in through the doorways between you and the
; outside (arches and open doors fully, closed doors muffled, a little through plain walls);
; 0 = by the distance to the nearest outside wall alone
doors_matter = 1
; how much of the outdoor sound a closed door lets through, and an open one (0..1)
closed_door = 0.35
open_door = 1
; how much plain walls let through, of what the distance to the outside wall would give (0..1)
wall_leak = 0.25
; 1 = a room with railings, fences or nothing instead of walls on at least a quarter of its
; edge (a porch, gazebo or balcony) counts as outside, also under its roof, and so does a
; spot under a roof in no room (eaves); 0 = the game's rooms and roofs decide
railings_outside = 1

[tv]
; first person: 1 = you watch a TV that is on by looking at it (the game's watch for its
; channel runs where you are: fun, moodlets, skill); near one that is on you get a little fun
gaze = 1
; degrees from straight ahead the screen may be (plus the screen's own size)
look_angle = 20
; seconds you can look away before watching stops
look_away = 3
; metres from a TV that is on (or the same room) for passive watching
nearby = 4
; passive fun as a share of what watching gives
passive_share = 0.3

[simsforever]
; first person: "Sims Forever" on a computer plays your real Sims 1 on that computer's screen.
; While it's on, your real mouse and keyboard play Sims 1 (the controllers stay The Sims 4's),
; you hear Sims 1 and the computer's own game sounds are muted. Laser or finger on the
; screen = its mouse too (trigger left button, A / X right button). Stopping the game or
; getting up closes Sims 1 outright 2 s later (no save question: save in Sims 1 first).
; DX11 only for now
on = 1
sims1_path = D:\Games\The Sims 1\Sims.exe
; -w = windowed (needed: it runs behind The Sims 4)
sims1_args = -w
; parts of the computer interaction tuning names that count as playing Sims Forever (the
; game's are computer_PlayGame_SimsForeverRenamed, ..._PlayGameTournament_..., ..._Livestream_...)
interactions = playgame_simsforever, playgametournament_simsforever, livestream_simsforever, game_stream_simsforever

[claude]
; first person: computers get a pie option "Open Claude" (works with [simsforever] on). It puts
; the Claude desktop app on that computer's screen, shaped like the screen: its window comes to
; the front so your real mouse and keyboard type into it; the laser or a finger on the screen is
; the mouse. "Close Claude", walking away or Sims Forever starting takes it off; the app keeps
; running and its window gets its old place and size back. DX11 only for now
on = 1
; TVs offer "Open Claude" too (drawn on their screen; usable from where you are, closes past 10 m).
; Laptops are computers and always offer it. Debug menu: Menus > Open Claude on TVs too
tvs = 0
; claude.exe when it isn't in the usual place (empty = %LOCALAPPDATA%\AnthropicClaude\claude.exe)
exe =

[voice]
; true = in first person your mic moves your Sim's mouth as you talk (mirrors show it; god
; view leaves the mouth to the game and doesn't use the mic). false = the mic isn't used
mic = true
; part of the mic's name (sims4vr.log lists them as "Voice: mic N"); empty = the one set as
; default input in Windows Sound settings
mic_device =
; loudness (dB) under which the mouth stays shut, and at which it opens all the way
; (sims4vr.log shows your levels every 30 s as "Voice: last 30 s")
mic_gate = -45
mic_full = -18
; degrees the jaw opens at its widest
mouth_open = 14

[phone]
; 1 = close your right hand down at your right hip (first person) and your Sim holds its
; phone; its screen shows the game menu and the game keeps running. Poke it with your
; left index finger or the left laser (grip + X). Open the hand to put it away. 0 = off
phone = 1
; metres below your eyes your right hand must be (sims4vr.log: "Phone: right hand closed")
hip_drop = 0.40
; 1 = in first person, when the game shows a popup (a dialog waiting for an answer) both controllers buzz
; like a phone, again every few seconds while the phone is away (3 times); take the phone
; out and the popup is on its screen. 0 = no buzz (the popup still shows on the phone)
popup_buzz = 1
; 1 = in first person a game notification about one Sim ("<name> had an awful Harvestfest")
; shows as a card over that Sim's head (yours: in front of you); 0 = phone only (the bell)
notes_overhead = 1
; our phone's size in metres (width, height, thickness), and the dark border around its screen
phone_width = 0.102
phone_height = 0.19
phone_depth = 0.009
bezel = 0.004
; the phone's centre from your right controller's grip, in your Sim's hand: toward the
; back of the hand (negative = out of the palm), toward the thumb, toward the wrist (metres)
phone_offset = -0.064 0.042 0.024
; degrees the phone rolls about the line of your hand (wrist to fingers)
tilt = -15
; then degrees it turns about its own bottom-to-top axis (counterclockwise seen from above)
yaw = 90
; then degrees its top tips away from you (negative = toward you), about its own left-right axis
pitch = 45
; the hand holding the phone keeps one fixed pose (the buttons don't move it): how far its
; four fingers close (0 open .. 1 fist), how far its thumb bends toward the palm (0 .. 1),
; and degrees the thumb swings away from the hand (negative = toward it)
finger_curl = 0.8
thumb_bend = 0.3
thumb_spread = 0
; the holding hand moved against the phone (the phone stays put), metres: out from the
; phone's middle (toward the edge the hand holds), up the phone, toward you (out of the screen)
hand_offset = 0 0 0
; and turned about the palm, degrees: about the phone's up axis, its left-right axis, and
; the line out of its screen. The left hand gets the mirror image of both
hand_turn = 0 0 0
; the part of the UI shown before the menu is found (x the UI's height)
crop_width = 0.45
crop_height = 0.80
; 1 = also put the game's own (old, low detail) phone model in your Sim's hand, inside the
; phone you see (test only; mirrors don't show our phone yet). If it shows upside down in a mirror, set
; prop_rotation = 0 0 180; if it faces the wrong way, 0 180 0. prop_offset moves it
; (metres: right, up, out of the screen)
game_phone = 0
prop_offset = 0 0 0
prop_rotation = 0 0 0

[tablet]
; 1 = in first-person build/buy mode the phone gesture (close a hand at your right hip) brings
; out a tablet instead of the phone: the build/buy UI's pieces packed together on its screen
; (the whole UI while a dialog or the game menu is up). Poke it with the
; other hand's index finger or point that hand's laser at it; point the laser past it into the
; world to place things. Open the hand to put it away. 0 = the phone as always
tablet = 1
; its size in metres (width, height, thickness) and the dark border around its screen;
; height 0 = its screen takes the shape of the packed UI (a wide rectangle)
width = 0.30
height = 0
depth = 0.008
bezel = 0.010
; how far in from its side edge your hand holds it (metres)
hold = 0.035

[dev]
; developer only: 1 = run sims4vr_probe.py from this folder whenever it changes
probe = 1

[bubbles]
; Speech/thought bubbles and skill bars ([ui] bubbles_3d lifts them into the world).
; First person: your own Sim's bubble and skill bar held in front of you,
; metres from your head: right, up, ahead.
own_in_front = 1
own_bubble_position = 0 0.08 0.6
own_skill_position = 0.14 0.2 0.6
; A bubble's width: yours in metres, other Sims' in game units.
own_size = 0.14
npc_size = 0.5
; Hide bubbles (speech, thought, shout, sentiment) in the game: yours (first person), everyone else's.
hide_own = 0
hide_npc = 0

[log]
; Lines in sims4vr.log read "[time] [tag] text"; the tag is the text before the first ": " (arm_ik, phone, walk_steps, frame_time, close_sounds ...)
; tags = all, or a comma list of the only tags to keep ("session" and "warning" always stay)
tags = all
; tags to drop (noisy ones), e.g. mute = frame_time, walk_steps, close_sounds
mute =
